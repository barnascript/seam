databases:
  - name: seam-db
    plan: free
    databaseName: seam
    user: seam

services:
  - type: web
    name: seam
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn seam.api:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: seam-db
          property: connectionString
      - key: WORKER_THREADS
        value: "4"
      - key: ANTHROPIC_API_KEY
        sync: false
