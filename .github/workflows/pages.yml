name: pages
# Publishes the web page (static files only) to GitHub Pages.
# The page talks to the hosted API set in the repository variable SEAM_API_URL.
on:
  push:
    branches: [main]
    paths: ["static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.SEAM_API_URL != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        env:
          SEAM_API_URL: ${{ vars.SEAM_API_URL }}
        run: |
          mkdir -p _site
          cp static/index.html _site/index.html
          cp -r static _site/static
          sed -i "s#__SEAM_API__#${SEAM_API_URL}#" _site/static/config.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
